<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Admin · Arc{% endblock title %}</title>
  <link rel="stylesheet" href="/public/styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div class="workbench">
    <aside class="rail">
      <a class="brand brand--rail" href="/admin"><span class="brand__mark">A</span><span>Arc</span></a>
      <nav aria-label="Application">
        <a href="/admin">Overview</a>
        <a href="/admin/profile">Profile</a>
        <a href="/admin/users">Users</a>
      </nav>
    </aside>
    <header class="topbar"><span class="mono">ADMIN</span><span class="status-dot">ONLINE</span></header>
    <main id="workspace" class="workspace">{% block content %}{% endblock content %}</main>
  </div>
</body>
</html>
