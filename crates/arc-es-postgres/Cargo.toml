[package]
name = "arc-es-postgres"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Postgres EventStore and ReadModelStore implementation for arc event sourcing"
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace crates
arc-core = { path = "../arc-core" }

# Database
sqlx.workspace = true

# Core event sourcing dependencies
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true

# Async runtime
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

# Logging
tracing.workspace = true

[dev-dependencies]
arc-core = { path = "../arc-core", features = ["test-utils"] }
