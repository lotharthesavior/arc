{% macro field(name, label, value="", type="text", error="") %}<div class="field{% if error %} field--invalid{% endif %}"><label for="{{ name }}">{{ label }}</label><input id="{{ name }}" name="{{ name }}" type="{{ type }}" value="{{ value }}" {% if error %}aria-invalid="true" aria-describedby="{{ name }}-error"{% endif %}>{% if error %}<p id="{{ name }}-error" class="field__error">{{ error }}</p>{% endif %}</div>{% endmacro field %}
{% macro status(label, tone="neutral") %}<span class="badge badge--{{ tone }}">{{ label }}</span>{% endmacro status %}
{% macro empty(title, detail) %}<div class="empty"><span class="empty__index">00</span><h2>{{ title }}</h2><p>{{ detail }}</p></div>{% endmacro empty %}
