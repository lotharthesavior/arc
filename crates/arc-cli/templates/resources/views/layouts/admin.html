<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Workbench · {{ app_name }}{% endblock title %}</title><link rel="stylesheet" href="/public/styles.css"></head>
<body><a class="skip-link" href="#workspace">Skip to workspace</a><div class="workbench"><aside class="rail"><a class="brand brand--rail" href="/admin"><span class="brand__mark">A</span><span>{{ app_name }}</span></a><nav aria-label="Administration"><a href="/admin">Overview</a><!-- arc:resource-navigation --><a href="/admin/profile">Profile</a><a href="/admin/settings">Settings</a></nav><form action="/signout" method="post"><input type="hidden" name="csrf_token" value="{{ session_csrf_token }}"><button class="rail__signout">Sign out</button></form></aside><header class="topbar"><button class="rail-toggle" aria-label="Toggle navigation">Menu</button><span class="mono">ENV / {{ environment | default(value="development") }}</span><span class="status-dot">ONLINE</span></header><main id="workspace" class="workspace">{% block content %}{% endblock content %}</main></div></body></html>
