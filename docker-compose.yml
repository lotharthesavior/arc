services:
  nats:
    image: nats:latest
    command: -js
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arc_dev
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    volumes:
      - app-db:/app/database
    environment:
      DATABASE_DRIVER: sqlite
      DATABASE_URL: database/arc_dev.db
      # To use the bundled postgres service instead, build the image with the
      # `postgres` cargo feature and switch to:
      #   DATABASE_DRIVER: postgres
      #   DATABASE_URL: postgres://arc:password@postgres:5432/arc_dev
      # then add `postgres: { condition: service_healthy }` under depends_on.
      NATS_URL: nats://nats:4222
      NATS_STREAM: EVENTS
      EVENT_BUS: nats
      APP_URL: 0.0.0.0
      APP_PORT: 8080
      APP_ENV: development
      SECRET_KEY: change-me-32-bytes-or-the-server-refuses-to-start
      JWT_SECRET: change-me-32-bytes-or-the-server-refuses-to-start
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["/usr/local/bin/arc-worker"]
    volumes:
      - app-db:/app/database
    environment:
      DATABASE_DRIVER: sqlite
      DATABASE_URL: database/arc_dev.db
      # Mirror the app service to target postgres: build with the `postgres`
      # feature, then set DATABASE_DRIVER=postgres and a postgres:// DATABASE_URL.
      NATS_URL: nats://nats:4222
      NATS_STREAM: EVENTS
      NATS_CONSUMER: arc-worker
      APP_ENV: development
    depends_on:
      nats:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  nats-data:
  pg-data:
  app-db:
